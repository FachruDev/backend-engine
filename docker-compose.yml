services:
  db:
    image: postgres:16-alpine
    container_name: ai_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d ai_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
